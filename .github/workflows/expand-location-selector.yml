name: Expand AGROBRIDGE location selector

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location:
    if: github.event.head_commit.message != 'Expand location selector [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch location selector
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          app = Path('src/App.jsx')
          text = app.read_text(encoding='utf-8')

          if 'india-states-districts' not in text:
              text = text.replace(
                  'import heroImage from "./assets/hero.png";\n',
                  'import heroImage from "./assets/hero.png";\nimport { getAllStatesWithDistricts } from "india-states-districts";\n'
              )

          text = text.replace('  state: "Karnataka",\n  taluk: "Mandya",', '  state: "Karnataka",\n  district: "Mandya",\n  taluk: "Mandya",')

          start = text.index('const locationData = {')
          end = text.index('const steps = [', start)
          replacement = '''const indiaLocationData = getAllStatesWithDistricts();
const countries = ["India"];
const states = () => indiaLocationData.map((item) => item.name);
const districts = (state) => indiaLocationData.find((item) => item.name === state)?.districts || [];

const LOCATION_SEARCH_URL = "https://nominatim.openstreetmap.org/search";

async function searchIndiaLocations({ state, district, query }) {
  const params = new URLSearchParams({
    format: "jsonv2",
    addressdetails: "1",
    limit: "50",
    country: "India",
    q: query || "",
  });
  if (state) params.set("state", state);
  if (district) params.set("county", district);
  const response = await fetch(`${LOCATION_SEARCH_URL}?${params.toString()}`, {
    headers: { Accept: "application/json" },
  });
  if (!response.ok) throw new Error(`Location search failed: ${response.status}`);
  return response.json();
}

'''
          text = text[:start] + replacement + text[end:]

          marker = '  const useCurrentLocation = () => {'
          handlers = '''  const [talukOptions, setTalukOptions] = useState([]);
  const [villageOptions, setVillageOptions] = useState([]);
  const [talukSearch, setTalukSearch] = useState("");
  const [villageSearch, setVillageSearch] = useState("");

  const changeCountry = (value) => {
    const nextStates = states();
    const nextState = value === "India" ? (nextStates.includes("Karnataka") ? "Karnataka" : nextStates[0] || "") : "";
    const nextDistricts = districts(nextState);
    setForm((current) => ({ ...current, country: value, state: nextState, district: nextDistricts[0] || "", taluk: "", village: "" }));
    setTalukOptions([]); setVillageOptions([]); setTalukSearch(""); setVillageSearch(""); setAnalysisDone(false);
  };

  const changeState = (value) => {
    const nextDistricts = districts(value);
    setForm((current) => ({ ...current, state: value, district: nextDistricts[0] || "", taluk: "", village: "" }));
    setTalukOptions([]); setVillageOptions([]); setTalukSearch(""); setVillageSearch(""); setAnalysisDone(false);
  };

  const changeDistrict = (value) => {
    setForm((current) => ({ ...current, district: value, taluk: "", village: "" }));
    setTalukOptions([]); setVillageOptions([]); setTalukSearch(""); setVillageSearch(""); setAnalysisDone(false);
  };

  useEffect(() => {
    let cancelled = false;
    if (!form.state || !form.district || talukSearch.trim().length < 2) { setTalukOptions([]); return undefined; }
    const timer = setTimeout(async () => {
      try {
        const results = await searchIndiaLocations({ state: form.state, district: form.district, query: talukSearch });
        if (cancelled) return;
        const names = [...new Set(results.map((item) => item.address?.municipality || item.address?.town || item.address?.county || item.display_name?.split(",")[0]).filter(Boolean))];
        setTalukOptions(names);
      } catch { if (!cancelled) setTalukOptions([]); }
    }, 500);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [form.state, form.district, talukSearch]);

  useEffect(() => {
    let cancelled = false;
    if (!form.state || !form.district || !form.taluk || villageSearch.trim().length < 2) { setVillageOptions([]); return undefined; }
    const timer = setTimeout(async () => {
      try {
        const results = await searchIndiaLocations({ state: form.state, district: form.district, query: `${villageSearch}, ${form.taluk}` });
        if (cancelled) return;
        const names = [...new Set(results.map((item) => item.address?.village || item.address?.hamlet || item.address?.town || item.display_name?.split(",")[0]).filter(Boolean))];
        setVillageOptions(names);
      } catch { if (!cancelled) setVillageOptions([]); }
    }, 500);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [form.state, form.district, form.taluk, villageSearch]);

'''
          old_handlers = re.search(r'  const changeCountry = \(value\) => \{.*?(?=  const useCurrentLocation = \(\) => \{)', text, re.S)
          if old_handlers:
              text = text[:old_handlers.start()] + handlers + text[old_handlers.end():]
          else:
              raise SystemExit('Could not find existing location handlers')

          old_block = re.search(r'<div className="location-selects">.*?</div>\n                  <div className="location-row">', text, re.S)
          if not old_block:
              raise SystemExit('Could not find location select block')
          new_block = '''<div className="location-selects">
                    <Field label="Country" icon="🌍"><select value={form.country} onChange={(e) => changeCountry(e.target.value)}><option value="">Select country</option>{countries.map((country) => <option key={country} value={country}>{country}</option>)}</select></Field>
                    <Field label="State / UT" icon="🏛️"><select value={form.state} onChange={(e) => changeState(e.target.value)} disabled={!form.country}><option value="">Select state / UT</option>{states().map((state) => <option key={state} value={state}>{state}</option>)}</select></Field>
                    <Field label="District" icon="🏙️"><select value={form.district} onChange={(e) => changeDistrict(e.target.value)} disabled={!form.state}><option value="">Select district</option>{districts(form.state).map((district) => <option key={district} value={district}>{district}</option>)}</select></Field>
                    <Field label="Taluk / Tehsil / Mandal" icon="📌"><input list="taluk-options" value={talukSearch || form.taluk} onChange={(e) => { setTalukSearch(e.target.value); update("taluk", e.target.value); }} placeholder="Type to search taluk / tehsil / mandal" disabled={!form.district} /><datalist id="taluk-options">{talukOptions.map((item) => <option key={item} value={item} />)}</datalist></Field>
                    <Field label="Village / Locality" icon="🏘️"><input list="village-options" value={villageSearch || form.village} onChange={(e) => { setVillageSearch(e.target.value); update("village", e.target.value); }} placeholder="Type to search village / locality" disabled={!form.taluk} /><datalist id="village-options">{villageOptions.map((item) => <option key={item} value={item} />)}</datalist></Field>
                  </div>
                  <div className="location-row">'''
          text = text[:old_block.start()] + new_block + text[old_block.end():]

          text = text.replace('Country, state, taluk and village.', 'Country, state, district, taluk and village.')
          text = text.replace('Select your administrative location and provide coordinates for satellite and weather analysis.', 'Select country, state/UT and district, then search the taluk/tehsil/mandal and village. Coordinates are still used for satellite and weather analysis.')

          app.write_text(text, encoding='utf-8')

          pkg = Path('package.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          data['dependencies']['india-states-districts'] = '^1.8.0'
          pkg.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install dependency and commit patch
        run: |
          npm install --package-lock-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx package.json package-lock.json
          git diff --cached --quiet || git commit -m "Expand location selector [skip ci]"
          git push
